name: Draft Release with Notes and Build Artifacts
on:
    push:
        tags:
            - "v*.*.*"
    workflow_dispatch:

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Install
              run: npm ci
            - name: Build
              run: npm run build
            - name: Release
              uses: softprops/action-gh-release@v2
              with:
                draft: true
                generate_release_notes: true
                append_body: true
                files: dist/*.js
